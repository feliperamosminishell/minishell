name: Update README Progress

on:
  # Se ejecuta automáticamente cada día a las 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  
  # También se puede ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
  
  # Se ejecuta cada vez que haces push a main
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/update-readme.yml'
      - 'update_readme.py'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🔄 Run README updater
        run: |
          python update_readme.py
      
      - name: 📊 Check if README was modified
        id: check_changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected in README.md"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ README.md was updated"
          fi
      
      - name: 💾 Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "🤖 Auto-update README progress [skip ci]"
          git push
      
      - name: 🎉 Success message
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "✅ README updated and pushed successfully!"
          echo "📊 Check your repository to see the updated progress bars"
