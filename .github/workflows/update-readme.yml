name: Update README Progress

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:
  
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/update-readme.yml'
      - 'update_readme.py'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📂 List files (debug)
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== Checking for update_readme.py ==="
          ls -la update_readme.py || echo "❌ update_readme.py not found!"
      
      - name: 🔄 Run README updater
        run: |
          if [ -f "update_readme.py" ]; then
            python update_readme.py
          else
            echo "❌ ERROR: update_readme.py not found in repository"
            exit 1
          fi
      
      - name: 📊 Check if README was modified
        id: check_changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected in README.md"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ README.md was updated"
          fi
      
      - name: 💾 Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "🤖 Auto-update README progress [skip ci]"
          git push
      
      - name: 🎉 Success message
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "✅ README updated and pushed successfully!"
          echo "📊 Check your repository to see the updated progress bars"
